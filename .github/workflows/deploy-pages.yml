name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          # Elenco foto, misure delle foto ed elenco testi: rigenerati qui, così non dipendono
          # da quanto era aggiornato il file salvato nel repository.
          node watch_images.js --once

          # Si pubblica solo quello che serve al sito (non node_modules, script di lavoro, ecc.)
          mkdir _site
          cp -r index.html 404.html css js fonts icons images testi _site/
          touch _site/.nojekyll

          # Versione di questa pubblicazione: i browser riscaricano file/foto solo quando cambia
          V="${GITHUB_SHA::8}"
          sed -i "s/?v=dev/?v=${V}/g; s/SITE_VERSION = \"dev\"/SITE_VERSION = \"${V}\"/" _site/index.html
          grep -q "SITE_VERSION = \"${V}\"" _site/index.html

          # Rete di sicurezza: ogni push su main va online da solo. Se un file del sito ha un errore di scrittura (per esempio le righe
          # "<<<<<<<" che un conflitto di GitHub Desktop lascia dentro un file) la pubblicazione si FERMA e resta online l'ultima
          # versione buona, invece di un sito bianco.
          for f in _site/js/*.js; do
            node --check "$f" || { echo "::error::$f ha un errore di scrittura: pubblicazione fermata, il sito online resta com'era"; exit 1; }
          done
          if grep -rlE '^(<<<<<<<|>>>>>>>)( |$)' _site/index.html _site/404.html _site/css _site/js _site/testi; then
            echo "::error::righe di conflitto (<<<<<<< / >>>>>>>) in un file del sito: pubblicazione fermata, il sito online resta com'era"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
