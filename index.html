<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lorenzo Romani — Photography</title>
  <meta name="description" content="Lorenzo Romani — photography" />
  <!-- Il sito si vede sempre con i suoi colori. Due segnali, perché a leggerli sono programmi diversi:
       - "only light": il modo con cui un sito dice "sono solo chiaro" ai browser che scuriscono le pagine da soli (Chrome ha una
         funzione così, "Auto Dark Theme", e descrive questo segnale per chi non vuole essere scurito);
       - "darkreader-lock": il modo con cui un sito chiede a Dark Reader (l'estensione più diffusa per scurire i siti) di lasciarlo stare.
       Un'estensione che non legge nessuno dei due, o una persona che sceglie apposta di invertire i colori, un sito non li può fermare. -->
  <meta name="color-scheme" content="only light" />
  <meta name="darkreader-lock" />
  <!-- Il carattere si scarica subito, prima del resto: così il testo non cambia misura a metà caricamento -->
  <link rel="preload" href="fonts/StrichpunktSans-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/style_v58.css?v=dev" />
</head>
<body>

  <div id="app" class="page" role="main">
    <!-- Tutto il sito è disegnato da JavaScript: se è spento la pagina sarebbe bianca. Il blocco sta DENTRO il foglio beige (sotto
         sarebbe fuori dallo schermo) e sparisce da solo appena il sito si disegna. -->
    <noscript>
      <p style="margin: 40px 20px; font-family: 'Courier New', Courier, monospace; font-size: 14px; line-height: 1.5; color: #2b2b28;">Lorenzo Romani — Photography. This site needs JavaScript to be displayed: please turn it on and reload the page.</p>
    </noscript>
  </div>

  <!-- "dev" viene sostituito con il codice della versione pubblicata (vedi .github/workflows/deploy-pages.yml):
       a ogni pubblicazione i browser scaricano i file nuovi, altrimenti usano quelli già in memoria. -->
  <script>window.SITE_VERSION = "dev";</script>
  <script src="js/images-data.js?v=dev"></script>
  <script src="js/site-state.js?v=dev"></script>
  <script src="js/content.js?v=dev"></script>
  <script src="js/recovered-captions.js?v=dev"></script>
  <script src="js/state-merge.js?v=dev"></script>
  <script src="js/app_v58.js?v=dev"></script>
</body>
</html>
